services:
  postgres:
    image: postgres:18.6-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: hevy
      POSTGRES_USER: hevy
      POSTGRES_PASSWORD: hevy_dev_password
    ports:
      - "5432:5432"
    volumes:
      - postgres18_data:/var/lib/postgresql
      - ./postgres-init.sql:/docker-entrypoint-initdb.d/10-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hevy -d hevy"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./backend
    restart: unless-stopped
    environment:
      PORT: 3000
      DATABASE_URL: postgres://hevy:hevy_dev_password@postgres:5432/hevy
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:-http://localhost:5173/api/auth/google/callback}
      LEGACY_OWNER_EMAIL: ${LEGACY_OWNER_EMAIL:-}
      WEB_ORIGIN: ${WEB_ORIGIN:-http://localhost:5173}
      SKIP_LOGIN: ${SKIP_LOGIN:-false}
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:3000/health"]
      interval: 10s
      timeout: 3s
      retries: 5

  web:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      api:
        condition: service_healthy


volumes:
  postgres18_data:
